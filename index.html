<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>TechWave!!</title>
  </head>
  <body class="font-[inter] mx-auto">
    <header></header>
    <!--Footer-->
    <footer class="">
      <div
        class="footer-container bg-[url(./assets/footer-bg.png)] w-[1600px] h-[412px] mx-auto content-center"
      >
        <div class="footer-logo">
          <img
            class="mx-auto mb-8 max-w-[410px] max-h-[60px]"
            src="./assets/footer-logo.png"
            alt=""
          />
        </div>
        <div
          class="social-container flex gap-10 justify-center text-white mb-8"
        >
          <div class="footer-social flex gap-2">
            <img class="size-6" src="./assets/spotify.png" alt="" />
            <p class="">Spotify</p>
          </div>
          <div class="footer-social flex gap-2">
            <img class="size-6" src="./assets/apple-podcast.png" alt="" />
            <p>Apple Podcasts</p>
          </div>
          <div class="footer-social flex gap-2">
            <img class="size-6" src="./assets/youtube-podcast.png" alt="" />
            <p>YouTube</p>
          </div>
          <div class="footer-social flex gap-2">
            <img class="size-6" src="./assets/twitter.png" alt="" />
            <p>Twitter</p>
          </div>
        </div>
        <div class="copyright">
          <p class="text-center mx-auto text-white">
            © 2026 TechWave Podcast. All rights reserved.
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
